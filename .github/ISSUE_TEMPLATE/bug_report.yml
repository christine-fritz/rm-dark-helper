name: Bug report
description: Report a problem with RM Dark Helper
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include private genealogy data unless it is necessary to reproduce the issue.

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: rootsmagic
    attributes:
      label: RootsMagic version
      placeholder: RootsMagic 11.x
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does the problem occur?
      options:
        - Main RootsMagic window
        - Edit Person
        - Another RootsMagic dialog/window
        - Tray menu / startup
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start RM Dark Helper
        2. Open ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Screenshots are helpful, but redact personal genealogy data first.
